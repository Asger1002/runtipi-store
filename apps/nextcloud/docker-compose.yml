services:
  nextcloud:
    image: 'nextcloud:35.0.0-apache'
    restart: unless-stopped
    depends_on:
      - db-nextcloud
      - redis-nextcloud
    volumes:
      - '${APP_DATA_DIR}/data/nextcloud:/var/www/html'
    environment:
      - 'NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}'
      - 'NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}'
      - 'POSTGRES_HOST=db-nextcloud'
      - 'POSTGRES_DB=nextcloud'
      - 'POSTGRES_USER=tipi'
      - 'POSTGRES_PASSWORD=tipi'
      - 'REDIS_HOST=redis-nextcloud'
      - 'NC_TRUSTED_PROXIES=172.16.0.0/12'
      - 'OVERWRITEPROTOCOL=https'
      - 'OVERWRITECLIURL=https://nextcloud.catla-spica.ts.net'
      - 'NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.catla-spica.ts.net tipi.local nextcloud collabora.my-store collabora'
      - 'PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}'
      - 'PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-1024M}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/status.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    x-runtipi:
      is_main: true
      internal_port: 80

  db-nextcloud:
    image: 'postgres:17'
    restart: unless-stopped
    volumes:
      - '${APP_DATA_DIR}/data/db:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_DB=nextcloud'
      - 'POSTGRES_USER=tipi'
      - 'POSTGRES_PASSWORD=tipi'

  redis-nextcloud:
    image: 'redis:7.4.11'
    restart: unless-stopped
    user: '1000:1000'
    volumes:
      - '${APP_DATA_DIR}/data/redis:/data'

  cron:
    image: 'nextcloud:35.0.0-apache'
    restart: unless-stopped
    entrypoint: '/cron.sh'
    depends_on:
      - db-nextcloud
      - redis-nextcloud
    volumes:
      - '${APP_DATA_DIR}/data/nextcloud:/var/www/html'

x-runtipi:
  schema_version: 2
