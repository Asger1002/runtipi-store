services:
  hermes:
    image: nousresearch/hermes-agent:latest
    command: gateway run
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hermes-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    command: dashboard --host 0.0.0.0 --insecure
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    networks:
      - hermes-net
    depends_on:
      - hermes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    x-runtipi:
      is_main: true
      internal_port: 9119

networks:
  hermes-net:
    driver: bridge

x-runtipi:
  schema_version: 2
