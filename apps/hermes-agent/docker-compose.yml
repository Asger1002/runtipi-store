services:
  hermes:
    image: nousresearch/hermes-agent:sha-bfc84bdc6f85c14715e06d5fa83192ea3e7c7f79
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    shm_size: 1g
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_UID=${HERMES_UID:-0}
      - HERMES_GID=${HERMES_GID:-0}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - API_SERVER_CORS_ORIGINS=${API_SERVER_CORS_ORIGINS:-*}
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    x-runtipi:
      is_main: true
      internal_port: 9119

networks:
  hermes-net:
    driver: bridge

x-runtipi:
  schema_version: 2
